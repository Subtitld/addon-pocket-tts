[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitld-addon-pocket-tts"
version = "26.10.1"
description = "Subtitld add-on: offline text-to-speech with Kyutai's Pocket TTS"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Subtitld", email = "jbopen@gmail.com" }]
requires-python = ">=3.10"

# No runtime dependencies. Synthesis is Kyutai's standalone pocket-tts binary
# (MIT), pinned and verified by tools/fetch_binary.py; the downloads use the
# standard library.
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]
dev = ["pytest>=7.4"]

[project.scripts]
pocket-tts-addon = "pocket_tts_addon.__main__:main"

[tool.setuptools]
packages = ["pocket_tts_addon"]

[tool.setuptools.package-data]
pocket_tts_addon = ["pins.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
